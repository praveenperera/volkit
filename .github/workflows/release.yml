# Publishes volkit to crates.io when a v* tag is pushed, through crates.io trusted publishing: the job trades its
# GitHub OIDC token for a short-lived crates.io token, so no registry secret is stored in the repository. The tag
# must name the crate's version. A version already on crates.io (one published by hand before this workflow
# existed) is skipped, so its tag's run passes without publishing again

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check the tag against the crate version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "volkit") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not name the crate version $version"
            exit 1
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' -A 'volkit-release (github.com/praveenperera/volkit)' \
            "https://crates.io/api/v1/crates/volkit/$version")
          case "$status" in
            200) echo "volkit $version is already on crates.io, nothing to publish"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io answered $status for volkit $version"; exit 1 ;;
          esac

      - name: Authenticate with crates.io
        if: steps.version.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p volkit --locked
